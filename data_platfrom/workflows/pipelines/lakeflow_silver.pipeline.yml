resources:
  pipelines:
    lakeflow_silver:
      name: lakeflow_silver
      configuration:
        pipeline.bronze_schema: "${var.schema}_bronze"
      libraries:
        - glob:
            include: ../../lakeflow/transformations/silver/**
      catalog: ${var.catalog}
      schema: ${var.schema}_silver
      serverless: true
      root_path: ${workspace.file_path}/lakeflow
