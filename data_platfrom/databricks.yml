# This is a Databricks asset bundle definition for segro_data_platfrom.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: data_platfrom
  uuid: 42a13a55-8e0b-48c9-b543-2efb0d728455

include:
  - workflows/*.yml
  - workflows/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  personal_dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-2536922427259734.14.azuredatabricks.net
    variables:
      catalog: dev
      schema: ${workspace.current_user.short_name}
  dev:
    mode: development
    workspace:
      host: https://adb-2536922427259734.14.azuredatabricks.net
    variables:
      catalog: dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-2536922427259734.14.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/admin@vertlib00gmail.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Users/admin@vertlib00gmail.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod
      schema: prod
    permissions:
      - user_name: admin@vertlib00gmail.onmicrosoft.com
        level: CAN_MANAGE
